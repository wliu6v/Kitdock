name: Photo organizer
on:
  push:
    paths: ['tools/photo-organizer/**', '.github/workflows/photo-organizer.yml']
  pull_request:
    paths: ['tools/photo-organizer/**', '.github/workflows/photo-organizer.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/photo-organizer
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[gui]"
      - name: Install ExifTool on macOS
        if: runner.os == 'macOS'
        run: brew install exiftool
      - name: Install ExifTool on Windows
        if: runner.os == 'Windows'
        run: choco install exiftool -y --no-progress
      - run: exiftool -ver
      - run: python -m unittest discover -s tests -v
      - run: python -m photo_organizer --help
