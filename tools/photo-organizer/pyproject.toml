[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kitdock-photo-organizer"
version = "0.1.0"
description = "Safely collect phone photos and videos into one dated directory"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.8,<7"]

[project.scripts]
photo-organizer = "photo_organizer.cli:main"

[project.gui-scripts]
photo-organizer-gui = "photo_organizer.gui:main"

[tool.setuptools.packages.find]
where = ["src"]
